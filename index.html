<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="Frenzy Client — Modern Minecraft Java Client and Launcher">
<title>Frenzy Client — Official</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#030303;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
    cursor:none;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
a{
    cursor:none;
}


/* =========================================================
   CUSTOM CURSOR
========================================================= */

.cursor{
    position:fixed;
    left:0;
    top:0;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    pointer-events:none;
    z-index:99999;
    transform:translate(-50%,-50%);
    box-shadow:
        0 0 8px #fff,
        0 0 18px #ff2cff,
        0 0 35px #ffb300;
    transition:
        width .15s,
        height .15s,
        background .15s;
}

.cursor-ring{
    position:fixed;
    left:0;
    top:0;
    width:40px;
    height:40px;
    border:1px solid #ff4cff;
    border-radius:50%;
    pointer-events:none;
    z-index:99998;
    transform:translate(-50%,-50%);
    box-shadow:
        0 0 12px #ff39ff,
        inset 0 0 12px #ff39ff;
    transition:
        width .2s,
        height .2s,
        border-color .2s;
}

body.hovering .cursor{
    width:7px;
    height:7px;
    background:#ffd45a;
}

body.hovering .cursor-ring{
    width:58px;
    height:58px;
    border-color:#ffd04a;
    box-shadow:
        0 0 20px #ffbb00,
        inset 0 0 15px #ff38ff;
}


/* =========================================================
   CLICK RIPPLE
========================================================= */

.click-ripple{
    position:fixed;
    width:10px;
    height:10px;
    border-radius:50%;
    border:2px solid #ffd34e;
    pointer-events:none;
    z-index:99990;
    animation:ripple .7s ease-out forwards;
}

@keyframes ripple{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.5);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(12);
    }
}


/* =========================================================
   LOADING SCREEN
========================================================= */

.loader{
    position:fixed;
    inset:0;
    z-index:100000;
    background:#020202;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:opacity .7s,visibility .7s;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-logo{
    font-size:38px;
    font-weight:1000;
    letter-spacing:8px;
    background:
        linear-gradient(
            90deg,
            #fff,
            #ffd13b,
            #ff49e8,
            #9d4cff,
            #fff
        );
    background-size:300%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:rainbow 2s linear infinite;
}

.loader-line{
    width:190px;
    height:2px;
    margin-top:25px;
    overflow:hidden;
    background:#191919;
}

.loader-line span{
    display:block;
    height:100%;
    width:40%;
    background:
        linear-gradient(
            90deg,
            #ff3cff,
            #ffd33d,
            #fff
        );
    animation:loaderbar 1.1s infinite;
}

.loader-text{
    margin-top:13px;
    color:#666;
    font-size:9px;
    letter-spacing:3px;
}

@keyframes loaderbar{
    0%{transform:translateX(-150%)}
    100%{transform:translateX(500%)}
}

@keyframes rainbow{
    0%{background-position:0%}
    100%{background-position:300%}
}


/* =========================================================
   SPARKLES
========================================================= */

.sparkles{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    overflow:hidden;
}

.spark{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 6px #fff,
        0 0 14px #fff;
    animation:floatSpark linear infinite;
}

.spark:nth-child(1){left:5%;top:20%;animation-duration:7s}
.spark:nth-child(2){left:13%;top:70%;animation-duration:9s}
.spark:nth-child(3){left:22%;top:38%;animation-duration:6s}
.spark:nth-child(4){left:31%;top:82%;animation-duration:11s}
.spark:nth-child(5){left:40%;top:17%;animation-duration:8s}
.spark:nth-child(6){left:48%;top:61%;animation-duration:10s}
.spark:nth-child(7){left:57%;top:29%;animation-duration:7s}
.spark:nth-child(8){left:64%;top:76%;animation-duration:9s}
.spark:nth-child(9){left:72%;top:42%;animation-duration:8s}
.spark:nth-child(10){left:80%;top:14%;animation-duration:12s}
.spark:nth-child(11){left:88%;top:67%;animation-duration:7s}
.spark:nth-child(12){left:95%;top:33%;animation-duration:10s}

@keyframes floatSpark{
    0%{
        opacity:.1;
        transform:translateY(30px) scale(.5);
    }
    50%{
        opacity:1;
        transform:translateY(-20px) scale(1.4);
    }
    100%{
        opacity:.1;
        transform:translateY(-80px) scale(.5);
    }
}


/* =========================================================
   BACKGROUND
========================================================= */

body:before{
    content:"";
    position:fixed;
    z-index:-3;
    width:650px;
    height:650px;
    left:50%;
    top:-350px;
    transform:translateX(-50%);
    background:#ff18d4;
    opacity:.10;
    filter:blur(160px);
    border-radius:50%;
}

body:after{
    content:"";
    position:fixed;
    z-index:-3;
    width:600px;
    height:600px;
    right:-250px;
    bottom:-250px;
    background:#ffb300;
    opacity:.06;
    filter:blur(160px);
    border-radius:50%;
}


/* =========================================================
   CONTAINER
========================================================= */

.wrap{
    width:min(1180px,calc(100% - 40px));

}


/* =========================================================
   NAVBAR
========================================================= */
