<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09060f">
<meta name="description" content="Frenzy Client — A modern Minecraft Java client and launcher.">
<title>Frenzy Client — Official</title>

<style>
/* =========================================================
   FRENZY CLIENT — SINGLE FILE WEBSITE
   No external CSS
   No external JavaScript
   No external fonts
   Designed for GitHub Pages
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #08050d;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
    line-height: 1.6;
}

a {
    color: inherit;
    text-decoration: none;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

/* =========================
   BACKGROUND
   ========================= */

body::before {
    content: "";
    position: fixed;
    top: -300px;
    left: 50%;
    width: 700px;
    height: 700px;
    transform: translateX(-50%);
    background: rgba(142, 55, 255, 0.18);
    filter: blur(130px);
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
}

body::after {
    content: "";
    position: fixed;
    bottom: -350px;
    right: -200px;
    width: 650px;
    height: 650px;
    background: rgba(87, 32, 190, 0.15);
    filter: blur(130px);
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
}

.page {
    width: 100%;
    min-height: 100vh;
}

/* =========================
   NAVBAR
   ========================= */

.navbar {
    position: sticky;
    top: 0;
    width: 100%;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(8,5,13,0.88);
    backdrop-filter: blur(18px);
}

.nav-inner {
    width: min(1180px, calc(100% - 40px));
    min-height: 76px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: linear-gradient(135deg,#a855f7,#6d28d9);
    box-shadow: 0 0 28px rgba(168,85,247,0.4);
    font-size: 16px;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 30px;
}

.nav-links a {
    color: #aaa3b5;
    font-size: 14px;
    font-weight: 700;
    transition: 0.25s ease;
}

.nav-links a:hover {
    color: #ffffff;
}

.nav-button {
    padding: 11px 19px;
    border-radius: 10px;
    background: #ffffff;
    color: #0a0710 !important;
    font-size: 13px !important;
    font-weight: 800 !important;
}

.nav-button:hover {
    background: #d8b4fe;
    transform: translateY(-1px);
}

/* =========================
   HERO
   ========================= */

.hero {
    width: min(1180px, calc(100% - 40px));
    min-height: 720px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    padding: 100px 0 90px;
}

.hero-content {
    width: 900px;
}

.hero-label {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 14px;
    border: 1px solid rgba(168,85,247,0.35);
    background: rgba(168,85,247,0.08);
    color: #cba4ff;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 28px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #b76cff;
    box-shadow: 0 0 12px #a855f7;
}

.hero h1 {
    font-size: clamp(55px, 9vw, 108px);
    line-height: 0.95;
    letter-spacing: -6px;
    font-weight: 950;
    margin-bottom: 30px;
}

.hero h1 span {
    color: #a855f7;
    text-shadow: 0 0 45px rgba(168,85,247,0.28);
}

.hero-description {
    width: min(650px,100%);
    margin: auto;
    color: #aaa3b5;
    font-size: 17px;
    line-height: 1.8;
}

.hero-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 36px;
}

.button {
    min-height: 52px;
    padding: 0 25px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 850;
    transition: 0.25s ease;
    cursor: pointer;
}

.button-primary {
    color: #ffffff;
    background: linear-gradient(135deg,#a855f7,#7227d8);
    box-shadow: 0 10px 35px rgba(123,42,216,0.25);
}

.button-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 45px rgba(168,85,247,0.38);
}

.button-secondary {
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.045);
}

.button-secondary:hover {
    background: rgba(255,255,255,0.09);
    transform: translateY(-3px);
}

/* =========================
   PVP PACK BUTTON
   ========================= */

.pvp-wrapper {
    margin-top: 28px;
    display: flex;
    justify-content: center;
}

.pvp-button {
    width: min(520px,100%);
    min-height: 66px;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border: 1px solid rgba(168,85,247,0.45);
    border-radius: 15px;
    background:
        linear-gradient(135deg,rgba(168,85,247,0.18),rgba(72,25,130,0.14));
    color: #e9d5ff;
    box-shadow:
        0 0 35px rgba(168,85,247,0.09),
        inset 0 0 25px rgba(168,85,247,0.03);
    font-size: 15px;
    font-weight: 900;
    transition: 0.25s ease;
}

.pvp-button:hover {
    transform: translateY(-4px);
    border-color: #a855f7;
    background: rgba(168,85,247,0.22);
    box-shadow: 0 15px 45px rgba(168,85,247,0.18);
}

.pvp-icon {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: rgba(168,85,247,0.2);
    font-size: 18px;
}

/* =========================
   HERO INFO
   ========================= */

.hero-info {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 38px;
}

.info-chip {
    padding: 8px 13px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    background: rgba(255,255,255,0.025);
    color: #85808e;
    font-size: 11px;
    font-weight: 700;
}

/* =========================
   SECTION
   ========================= */

.section {
    width: min(1180px, calc(100% - 40px));
    margin: auto;
    padding: 110px 0;
}

.section-heading {
    margin-bottom: 42px;
}

.section-number {
    color: #a855f7;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.section-heading h2 {
    font-size: clamp(34px,5vw,58px);
    line-height: 1;
    letter-spacing: -3px;
}

.section-heading p {
    max-width: 620px;
    color: #8e8996;
    margin-top: 18px;
}

/* =========================
   FEATURE GRID
   ========================= */

.features-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 14px;
}

.feature-card {
    min-height: 245px;
    padding: 28px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    background: rgba(255,255,255,0.025);
    transition: 0.25s ease;
}

.feature-card:hover {
    transform: translateY(-5px);
    border-color: rgba(168,85,247,0.35);
    background: rgba(168,85,247,0.045);
}

.feature-icon {
    width: 45px;
    height: 45px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: rgba(168,85,247,0.12);
    border: 1px solid rgba(168,85,247,0.18);
    font-size: 20px;
    margin-bottom: 25px;
}

.feature-card h3 {
    font-size: 18px;
    margin-bottom: 10px;
}

.feature-card p {
    color: #85808e;
    font-size: 14px;
    line-height: 1.7;
}

/* =========================
   LAUNCHER
   ========================= */

.launcher-section {
    padding-top: 80px;
}

.launcher-box {
    border: 1px solid rgba(168,85,247,0.18);
    border-radius: 24px;
    background:
        linear-gradient(145deg,rgba(168,85,247,0.08),rgba(255,255,255,0.02));
    padding: 42px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 45px;
    align-items: center;
}

.launcher-copy h2 {
    font-size: clamp(32px,5vw,55px);
    line-height: 1;
    letter-spacing: -3px;
    margin-bottom: 18px;
}

.launcher-copy p {
    color: #96909f;
    max-width: 530px;
    line-height: 1.8;
}

.launcher-list {
    margin-top: 25px;
    display: grid;
    gap: 11px;
}

.launcher-list div {
    display: flex;
    gap: 11px;
    align-items: center;
    color: #c6c0cc;
    font-size: 14px;
}

.check {
    color: #b66cff;
    font-weight: 900;
}

.launcher-preview {
    min-height: 330px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 17px;
    background: #0b0811;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.25);
}

.preview-top {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 15px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
}

.preview-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4d4854;
}

.preview-body {
    padding: 30px;
}

.preview-logo {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    background: linear-gradient(135deg,#a855f7,#6122b7);
    font-size: 25px;
    font-weight: 900;
    margin-bottom: 22px;
}

.preview-body h3 {
    font-size: 25px;
    margin-bottom: 7px;
}

.preview-body p {
    color: #77717f;
    font-size: 13px;
    margin-bottom: 25px;
}

.preview-bar {
    height: 46px;
    width: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg,#9b4ee8,#6725bd);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 900;
}

/* =========================
   DOWNLOAD
   ========================= */

.download-section {
    text-align: center;
}

.download-card {
    padding: 65px 30px;
    border: 1px solid rgba(168,85,247,0.22);
    border-radius: 25px;
    background:
        radial-gradient(circle at center,rgba(168,85,247,0.11),transparent 60%),
        rgba(255,255,255,0.018);
}

.download-card .section-number {
    margin-bottom: 15px;
}

.download-card h2 {
    font-size: clamp(38px,6vw,65px);
    letter-spacing: -4px;
    line-height: 1;
}

.download-card p {
    color: #8e8996;
    max-width: 610px;
    margin: 20px auto 30px;
}

.download-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #aaa3b5;
    font-size: 12px;
    margin-top: 18px;
}

.download-status span {
    width: 7px;
    height: 7px;
    background: #8e8996;
    border-radius: 50%;
}

/* =========================
   SUPPORT
   ========================= */

.support-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 14px;
}

.support-card {
    min-height: 145px;
    padding: 27px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 17px;
    background: rgba(255,255,255,0.025);
    transition: 0.25s ease;
}

.support-card:hover {
    transform: translateY(-4px);
    border-color: rgba(168,85,247,0.3);
}

.support-card b {
    display: block;
    font-size: 17px;
    margin-bottom: 10px;
}

.support-card span {
    color: #827c89;
    font-size: 13px;
}

/* =========================
   FAQ
   ========================= */

.faq-list {
    display: grid;
    gap: 10px;
}

details {
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    background: rgba(255,255,255,0.025);
    overflow: hidden;
}

summary {
    cursor: pointer;
    list-style: none;
    padding: 21px 24px;
    font-size: 14px;
    font-weight: 800;
}

summary::-webkit-details-marker {
    display: none;
}

summary::after {
    content: "+";
    float: right;
    color: #a855f7;
    font-size: 18px;
}

details[open] summary::after {
    content: "−";
}

details p {
    padding: 0 24px 23px;
    color: #817b89;
    font-size: 13px;
    line-height: 1.8;
}

/* =========================
   COMMUNITY
   ========================= */

.community {
    text-align: center;
}

.community-box {
    padding: 70px 25px;
    border-radius: 25px;
    border: 1px solid rgba(168,85,247,0.2);
    background: rgba(168,85,247,0.045);
}

.community-box h2 {
    font-size: clamp(35px,6vw,60px);
    letter-spacing: -3px;
    line-height: 1;
}

.community-box p {
    max-width: 560px;
    color: #8b8592;
    margin: 20px auto 30px;
}

/* =========================
   FOOTER
   ========================= */

footer {
    border-top: 1px solid rgba(255,255,255,0.07);
    padding: 45px 20px;
}

.footer-inner {
    width: min(1180px,100%);
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
}

.footer-brand {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
}

.footer-brand span {
    display: block;
    color: #77717e;
    font-size: 11px;
    font-weight: 600;
    margin-top: 7px;
    letter-spacing: 0;
}

.footer-links {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.footer-links a {
    color: #77717e;
    font-size: 12px;
}

.footer-links a:hover {
    color: #c99bff;
}

.copyright {
    color: #55505b;
    font-size: 11px;
}

/* =========================
   MOBILE
   ========================= */

@
